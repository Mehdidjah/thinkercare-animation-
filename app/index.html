<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>ThinkerCare Terrain</title>
    <meta
      name="description"
      content="Planning, animations, stocks et ventes. L’espace terrain TOUCHÉ, BELNCO et NOOM. Accès réservé."
    />
    <link rel="icon" href="/assets/favicon.svg" />
    <!-- Static shell shown while the bundle loads; React replaces #root's content. No inline script (CSP). -->
    <style>
      body{margin:0;background:#f4f6f3;color:#202923;font-family:Arial,Helvetica,sans-serif}
      .boot{min-height:100dvh;display:grid;place-content:center;gap:25px}
      .boot .wordmark{font-size:27px;font-weight:800;letter-spacing:-1.2px}
      .boot .wordmark span{display:block;font-size:10px;letter-spacing:5px;font-weight:600;padding-top:7px}
      .boot p{color:#738077;font-size:12px;margin:0}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading boot">
        <div class="wordmark">thinkercare<span>TERRAIN</span></div>
        <p>Ouverture de votre espace…</p>
        <noscript><p>Activez JavaScript pour utiliser ThinkerCare Terrain.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
